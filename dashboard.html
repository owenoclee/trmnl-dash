<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      width: 1872px;
      height: 1404px;
      background: white;
      color: black;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 1872px;
      height: 1404px;
      /* margins: 0.4in × 0.45in at 227ppi = 91px × 102px */
      padding: 91px 102px;
    }

    /* Debug: dotted rectangle showing the content margin boundary */
    .page::before {
      content: '';
      display: none;
      position: absolute;
      top: 91px;
      left: 102px;
      width: 1668px;
      height: 1222px;
      border: 2px dotted black;
      pointer-events: none;
      z-index: 999;
    }

    body.debug .page::before {
      display: block;
    }

    /* Debug: dashed line through the horizontal center of the page */
    .page::after {
      content: '';
      display: none;
      position: absolute;
      top: 0;
      left: 935px;
      width: 2px;
      height: 1404px;
      border-left: 2px dashed black;
      pointer-events: none;
      z-index: 999;
    }

    body.debug .page::after {
      display: block;
    }

    /* Debug: two dashed lines marking a center gutter as wide as the page
   margin (102px), i.e. ±51px from the center line — for a two-column layout */
    body::before,
    body::after {
      content: '';
      display: none;
      position: absolute;
      top: 0;
      width: 2px;
      height: 1404px;
      border-left: 2px dashed black;
      pointer-events: none;
      z-index: 999;
    }

    body::before {
      left: 884px;
    }

    /* center 936 − 51 */
    body::after {
      left: 986px;
    }

    /* center 936 + 51 */
    body.debug::before,
    body.debug::after {
      display: block;
    }

    /* Header — one grid across both columns (783px each, split by the 102px
       gutter): a hero line above a divided strip of metric cells on each side.
       Left is the date over personal stats, right the current weather over its
       conditions. A shared grid row puts the date and the temperature on one
       baseline and both metric strips at one height. Purely data-driven, with
       hairlines echoing the charts' grid aesthetic. */
    .top {
      display: grid;
      grid-template-columns: 783px 783px;
      column-gap: 102px;
      align-items: baseline;
      margin-bottom: 68px;
    }

    /* Charts sit in the same two columns below the header. */
    .cols {
      display: flex;
      gap: 102px;
    }

    .week-charts,
    .charts {
      width: 783px;
    }

    /* Hero: current temperature + condition, sitting on a shared baseline. */
    .cond-head {
      display: flex;
      align-items: baseline;
      gap: 24px;
      margin-bottom: 20px;
    }

    /* The date — deliberately calmer than the weather temp (the page's hero). */
    /* No bottom margin and a tight line box: the weather hero's margin sets the
       row's depth, so the date can't push both metric strips down. */
    .date-title {
      font-size: 54px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
    }

    .cond-temp {
      font-size: 100px;
      font-weight: 700;
      line-height: 0.82;
      letter-spacing: -3px;
    }

    .cond-name {
      font-size: 40px;
      font-weight: 500;
    }

    /* Metric strip — KPI cells split by hairlines, like the chart grid lines. */
    .metrics {
      display: flex;
      border-top: 2px solid black;
      padding-top: 14px;
    }

    .metric {
      flex: 1;
    }

    .metric+.metric {
      padding-left: 22px;
      border-left: 1px solid black;
    }

    .metric-label {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #5a5a5a;
      white-space: nowrap;
      margin-bottom: 7px;
    }

    .metric-value {
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    /* Units ride small alongside the value — matching the charts' value+unit labels.
       'C' sits close to the number; word units (.txt, e.g. mph) get a wider gap. */
    .unit {
      font-size: 0.46em;
      font-weight: 500;
      margin-left: 0.08em;
    }

    .unit.txt {
      margin-left: 0.16em;
    }

    /* Photo slot at the bottom of the left column. The image is fetched from the
       server, cover-cropped and dithered on a <canvas> in JS (see DITHER below). */
    .photo {
      position: absolute;
      left: 102px;
      /* left column left edge (content left) */
      bottom: 91px;
      /* content bottom margin */
      width: 783px;
      /* left column width */
      height: 380px;
      /* sits below the week charts in the left column */
    }

    /* Canvas backing store == on-screen pixels; the dither is computed at this
       resolution (1:1) and cover-cropped in JS, so no object-fit scaling here. */
    .photo canvas {
      display: block;
      width: 783px;
      height: 380px;
      border-radius: 32px;
    }

  </style>
</head>

<body>
  <div class="page">

    <div class="top">
      <div class="date-title" id="date-title"></div>
      <div class="cond-head">
        <div class="cond-temp" id="w-temp"></div>
        <div class="cond-name" id="w-condition"></div>
      </div>
      <div class="metrics" id="s-metrics"></div>
      <div class="metrics" id="w-metrics"></div>
    </div>

    <div class="cols">
      <div class="week-charts"></div>
      <div class="charts"></div>
    </div>

    <div class="photo">
      <canvas id="photo-canvas"></canvas>
    </div>

  </div>

  <!-- D3 — loaded from CDN (works both in headless Chrome render and direct browser preview) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

  <!-- Chart data: Go injects JSON here; falls back to fake data when opened directly -->
  <script type="application/json" id="chart-data">{{.DataJSON}}</script>

  <!-- Photo: Go injects the server-selected image (per --photo-strategy) -->
  <script type="application/json" id="photos-data">{{.PhotosJSON}}</script>

  <!-- Personal stats: Go injects the last week from Prometheus ("null" → empty
       charts). Literal when opened directly — the page then shows a sample week. -->
  <script type="application/json" id="stats-data">{{.StatsJSON}}</script>

  <!-- Tunables: Go injects config.json here so a render uses the applied values.
       Empty/literal when opened directly in a browser — the page then falls back
       to the built-in cfg defaults, and the panel's Apply button writes this file. -->
  <script type="application/json" id="chart-config">{{.ConfigJSON}}</script>

  <!-- Chart rendering — pure presentation, no data fetching -->
  <script>
    (function () {
      const DATA = (() => {
        try {return JSON.parse(document.getElementById('chart-data').textContent);} catch (e) { }
        return {
          temp: 11.4, feelsLike: 9.4, tempMin: 7.8, tempMax: 14.6, windMPH: 17.3, condition: 'Partly cloudy', debug: true,
          hourlyTemp: [7.2, 7.8, 6.9, 7.1, 7.4, 8.3, 9.1, 10.4, 11.2, 12.7, 13.1, 14.3, 14.6, 14.8, 13.9, 12.4, 11.8, 10.9, 9.7, 9.2, 8.6, 8.1, 7.8, 7.5],
          hourlyWind: [14.2, 13.8, 12.9, 13.7, 15.1, 16.4, 17.8, 19.5, 21.3, 22.7, 21.9, 19.6, 17.3, 16.8, 15.4, 16.2, 17.9, 18.6, 17.4, 15.8, 14.5, 13.7, 12.9, 12.1],
          hourlyPrecip: [0, 0, 0, 0, 0, 0, 0, 5, 12, 22, 31, 43, 52, 46, 33, 21, 14, 9, 4, 0, 0, 0, 0, 0],
          hourlyUV: [0, 0, 0, 0, 0, 0, 0.2, 0.8, 1.7, 2.9, 4.1, 5.3, 6.1, 6.4, 5.9, 4.8, 3.4, 2.1, 1.0, 0.3, 0, 0, 0, 0],
        };
      })();

      // Personal stats for the left column: the last N_WEEK local days from
      // Prometheus. null → the server has none (charts draw empty). Opened from
      // disk → a generated sample week.
      const STATS = (() => {
        try {return JSON.parse(document.getElementById('stats-data').textContent);} catch (e) { }
        const d = new Date();
        const start = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 6) / 1000;
        const co2 = [], dataGB = [];
        for (let t = start + 1800; t <= Date.now() / 1000; t += 1800) {
          const h = new Date(t * 1000).getHours();
          co2.push([t, 520 + 420 * Math.max(0, Math.cos((h - 5) / 24 * 2 * Math.PI)) + 40 * Math.sin(t / 5000)]);
          dataGB.push([t, 44 - (t - start) / 86400 * 1.4]);
        }
        return {
          windowStart: start, step: 1800, screenHours: [3.2, 1.4, 4.6, 2.1, 0.8, 3.7, 1.9],
          co2, co2Now: 640, dataGB, dataNowGB: 35.2, allowanceGB: 50,
          boostStart: start - 86400 * 20, boostEnd: start + 86400 * 16,
        };
      })();

      // ---------------------------------------------------------------------------
      // Fixed constants
      // ---------------------------------------------------------------------------
      const CONTENT_W = 1872 - 2 * 102;
      const GUTTER = 102;                       // column gap = left/right page margin
      const COL_W = (CONTENT_W - GUTTER) / 2;  // width of each of the two columns (783)
      const N_DAY = 16;
      const START_HOUR = 7;                     // first hour on the x-axis (index 0); window is START_HOUR … START_HOUR+N_DAY-1
      const GRID_SW = 1;
      const N_WEEK = 7;                         // day slots in the left column's charts, ending today
      const SCREEN_GOAL_H = 1;                  // daily screen-time goal to beat (hours)
      const PHOTO_GAP = 40;                     // space kept between the week charts' labels and the photo
      const FONT = "'Inter', system-ui, sans-serif";

      // ---------------------------------------------------------------------------
      // Tunable config — driven by sliders in browser preview, fixed at render time
      // ---------------------------------------------------------------------------
      const cfg = {
        labelGap: 14,                   // gap between chart edge and y-axis label
        notch: 9,                    // v-line notch depth (px into chart)
        notchSm: 4,                    // minor (unlabelled) tick notch depth
        notchW: 1,                    // v-line notch stroke width (px)
        nowW: 2,                    // current-time line stroke width (px)
        vExt: 36,                   // v-line extension below last chart
        chartH: 136,                  // chart height
        chartGap: 52,                   // vertical gap between charts
        labelFs: 25,                   // label font size
      };

      // Overlay the server-applied config (config.json, injected above). Only the
      // keys present there are overridden, so defaults survive for anything new.
      // No-op when opened directly: the placeholder isn't valid JSON, so we keep
      // the defaults and let the Apply button generate the file.
      try {
        const saved = JSON.parse(document.getElementById('chart-config').textContent);
        if (saved && typeof saved === 'object') Object.assign(cfg, saved);
      } catch (e) { /* opened from disk — keep defaults */}

      // Preview-only override for "now", as a fractional hour (driven by a slider in
      // the controls panel). Stays null in headless render → real host clock. NOT part
      // of cfg, so it's never written to / read from config.json.
      let nowHour = null;

      // ---------------------------------------------------------------------------
      // Helpers
      // ---------------------------------------------------------------------------
      const px = n => Math.round(n) + 0.5;
      // Snap a stroke's centre to the pixel grid so crispEdges renders it at a
      // consistent width: an EVEN width must centre on an integer (its two edges
      // land on whole-pixel boundaries), an ODD width on a half-pixel. The wrong
      // phase makes e.g. a 2px line straddle three columns and render unevenly.
      const crispX = (n, w) => Math.round(n) + (w % 2 ? 0.5 : 0);

      function fmtDecimal(v) {
        const r = Math.round(v * 10) / 10;
        const neg = r < 0;
        const abs = Math.abs(r);
        const int = Math.floor(abs);
        const dec = Math.round((abs - int) * 10);
        return {int: `${neg ? '-' : ''}${int}`, dec: dec > 0 ? `.${dec}` : ''};
      }

      function fmtFrac(v) {
        const r = Math.round(v * 4) / 4;
        const neg = r < 0;
        const abs = Math.abs(r);
        const int = Math.floor(abs);
        const frac = abs - int;
        const glyph = {0.25: '¼', 0.5: '½', 0.75: '¾'}[frac] ?? '';
        const sign = neg ? '-' : '';
        if (glyph && int > 0) return `${sign}${int} ${glyph}`;
        if (glyph) return `${sign}${glyph}`;
        return `${sign}${int}`;
      }

      function sliceDay(arr) {return arr.slice(START_HOUR, START_HOUR + N_DAY);}

      // 12-hour clock parts for an hour-of-day, e.g. 15 → {h: '3', ap: 'PM'} — for axis labels.
      function hourParts(h) {
        const ap = (h % 24) < 12 ? 'AM' : 'PM';
        return {h: String(h % 12 === 0 ? 12 : h % 12), ap};
      }

      function styleLine(el) {
        return el
          .attr('stroke-width', GRID_SW)
          .attr('stroke-dasharray', '8,6')
          .attr('shape-rendering', 'crispEdges');
      }
      function blendLine(el) {
        return styleLine(el).attr('stroke', 'white').style('mix-blend-mode', 'difference');
      }
      function blendTick(el) {
        return el
          .attr('stroke', 'white').attr('stroke-width', cfg.notchW)
          .attr('shape-rendering', 'crispEdges').style('mix-blend-mode', 'difference');
      }

      // ---------------------------------------------------------------------------
      // Render — clears and redraws the chart SVG from current cfg
      // ---------------------------------------------------------------------------
      function render() {
        const {labelGap, notch, notchSm, notchW, vExt, chartH, chartGap, labelFs} = cfg;
        const chartX0 = 0;                       // flush to the left edge of the column

        const series = [
          {data: sliceDay(DATA.hourlyTemp), unit: 'C', name: 'Temperature'},
          {data: sliceDay(DATA.hourlyUV), unit: '', name: 'UV Index', yMin: 0},
          {data: sliceDay(DATA.hourlyWind), unit: 'mph', name: 'Wind Speed'},
          {data: sliceDay(DATA.hourlyPrecip), unit: '%', name: 'Precipitation', yMin: 0, yMax: 100},
        ];

        const chartsH = series.length * chartH + (series.length - 1) * chartGap;
        const svgH = chartsH + vExt + labelFs + 4;

        d3.select('.charts').selectAll('*').remove();
        const svg = d3.select('.charts').append('svg')
          .attr('width', COL_W).attr('height', svgH)
          .style('display', 'block').style('overflow', 'visible');

        // Data ranges — independent of chart width, but needed to size the value labels.
        const bounds = series.map(({data, yMin, yMax}) => ({
          dMin: yMin ?? d3.min(data),
          dMax: yMax ?? d3.max(data),
        }));

        // Flush layout: the plot starts at the column's left edge (chartX0 = 0) and the
        // widest value label's right edge lands on the column's right edge (COL_W). The
        // labels are variable width, so measure them and let chartW adapt to fit.
        const unitFs = Math.round(labelFs * 0.85);
        const measure = svg.append('text').attr('x', 0).attr('y', 0).attr('font-family', FONT);
        const labelExtent = (val, unit) => {
          measure.selectAll('*').remove();
          measure.append('tspan').attr('font-size', labelFs).text(Math.round(val));
          measure.append('tspan').attr('font-size', unitFs).attr('dx', 2).text(unit);
          const b = measure.node().getBBox();
          return b.x + b.width;                  // rightmost inked x, relative to the anchor
        };
        const maxLabelW = Math.max(...series.flatMap(({unit}, ci) => {
          const {dMin, dMax} = bounds[ci];
          return [dMax, (dMin + dMax) / 2, dMin].map(v => labelExtent(v, unit));
        }));
        measure.remove();

        const chartW = COL_W - labelGap - maxLabelW;
        const chartX1 = chartX0 + chartW;        // right edge of the plotted area — the fill, h-lines, and inset right notch all land here

        // Pre-compute scales for each series (needed across passes)
        const scales = series.map(({data, yMin, yMax}, ci) => {
          const cy = ci * (chartH + chartGap);
          const {dMin, dMax} = bounds[ci];
          return {
            cy, dMin, dMax,
            xScale: d3.scaleLinear().domain([0, data.length - 1]).range([chartX0, chartX0 + chartW]),
            yScale: d3.scaleLinear().domain([dMin, dMax]).range([cy + chartH, cy]),
          };
        });

        // Pass 1 — fills
        series.forEach(({data}, ci) => {
          const {cy, xScale, yScale} = scales[ci];
          svg.append('path').datum(data)
            .attr('fill', 'black').attr('stroke', 'none').attr('shape-rendering', 'crispEdges')
            .attr('d', d3.area().x((d, i) => xScale(i)).y0(cy + chartH).y1(d => yScale(d)).curve(d3.curveMonotoneX));
        });

        // Pass 2 — blend-mode v-ticks (before h-lines so h-lines render on top, covering intersections)
        const timeStep = chartW / (N_DAY - 1);
        const labelY = chartsH + vExt + 4;
        const majorIdxs = new Set([0, 3, 6, 9, 12, 15]);   // labelled hours: every 3rd point

        // Current-time line geometry — computed here, before the notches, so any notch
        // the line covers can be suppressed. A notch left under the line would make the
        // blend-mode line invert against the notch (itself already inverted vs the fill)
        // instead of against the chart, giving a "double-inverted" segment. The line
        // already marks that column, so dropping the covered notch lets it own the
        // inversion and read cleanly against the chart.
        const now = new Date();
        const nowH = nowHour != null ? nowHour : now.getHours() + now.getMinutes() / 60;
        const nowIdx = nowH - START_HOUR;        // 0 = START_HOUR (left edge) … N_DAY-1 (right edge)
        const nowOn = nowIdx >= 0 && nowIdx <= N_DAY - 1;
        const nowNx = nowOn ? crispX(chartX0 + nowIdx * timeStep, cfg.nowW) : null;
        // A notch at column `vx` is covered when its stroke overlaps the now-line's.
        const underNow = vx => nowNx != null && Math.abs(vx - nowNx) < (cfg.nowW + notchW) / 2;
        // The line stands on a labelled hour when it covers that hour's (major) notch —
        // then it must reach the time label, standing in for the notch's connector.
        const nowOnMajor = nowOn && majorIdxs.has(Math.round(nowIdx)) &&
          underNow(crispX(chartX0 + Math.round(nowIdx) * timeStep, notchW));

        // Minor ticks — every unlabelled hour
        for (let idx = 0; idx < N_DAY; idx++) {
          if (majorIdxs.has(idx)) continue;
          const vx = crispX(chartX0 + idx * timeStep, notchW);
          if (underNow(vx)) continue;   // the now-line covers this column — let it own the inversion
          series.forEach((_, ci) => {
            const top = ci * (chartH + chartGap);
            const bot = top + chartH;
            blendTick(svg.append('line').attr('x1', vx).attr('y1', top + 1).attr('x2', vx).attr('y2', top + notchSm + 1));
            blendTick(svg.append('line').attr('x1', vx).attr('y1', bot - notchSm).attr('x2', vx).attr('y2', bot));
          });
        }

        [...majorIdxs].sort((a, b) => a - b).forEach((idx, li, all) => {
          const labelX = px(chartX0 + idx * timeStep);
          const isFirst = li === 0, isLast = li === all.length - 1;
          const isOuter = isFirst || isLast;
          // Edge notches sit on the chart's left/right boundary. Draw them as an
          // INSIDE stroke (inset by half the width) so a wider notch grows into
          // the chart rather than out past the edge — otherwise a full-height
          // (100%) black chart shows the notch as a bump sticking out the side.
          // They stay solid black (no blend-mode inversion), unlike inner notches.
          const vx = isOuter
            ? (isFirst ? chartX0 + notchW / 2 : Math.round(chartX1) - notchW / 2)
            : crispX(chartX0 + idx * timeStep, notchW);
          const tick = el => isOuter
            ? el.attr('stroke', 'black').attr('stroke-width', notchW).attr('shape-rendering', 'crispEdges')
            : blendTick(el);
          // Drop the notch entirely where the now-line covers it — the line stands in
          // for it, and a kept notch would corrupt the line's inversion. The time label
          // below is always drawn; the now-line extends down to it (see Pass 4).
          if (!underNow(vx)) series.forEach((_, ci) => {
            const top = ci * (chartH + chartGap);
            const bot = top + chartH;
            const topExt = isOuter ? 0 : notch;
            const botExt = ci === series.length - 1 ? vExt : (isOuter ? 0 : notch);
            tick(svg.append('line').attr('x1', vx).attr('y1', top - topExt + 1).attr('x2', vx).attr('y2', top + notch + 1));
            tick(svg.append('line').attr('x1', vx).attr('y1', bot - notch).attr('x2', vx).attr('y2', bot + botExt));
          });
          // Hour label as "<12h> <small AM/PM>", baseline-aligned and centred on the tick
          // — mirrors the y-axis value+unit styling. The baseline is dropped by the cap
          // height so the digits sit where the old hanging top did.
          const {h: hLabel, ap} = hourParts(START_HOUR + idx);
          const t = svg.append('text').attr('x', labelX).attr('y', labelY + labelFs * 0.72)
            .attr('text-anchor', 'middle').attr('font-family', FONT);
          t.append('tspan').attr('font-size', labelFs).text(hLabel);
          t.append('tspan').attr('font-size', unitFs).attr('dx', 2).text(ap);
        });

        // Pass 3 — h-lines, labels, chart name (on top of blend-mode ticks, covering intersection artifacts)
        // Draw a horizontal grid line, but leave a gap where the now-line crosses so the
        // (blend-mode) now-line inverts against the chart there, not against this h-line.
        // The gap is exactly covered by the now-line; stroke-dashoffset keeps the dashed
        // mid-line's rhythm continuous across it (a harmless no-op for the solid edges).
        const hLine = (y, styleFn) => {
          const seg = (x1, x2) => styleFn(svg.append('line')
            .attr('x1', x1).attr('y1', y).attr('x2', x2).attr('y2', y)
            .attr('stroke-dashoffset', x1 - chartX0));
          if (nowNx != null && nowNx > chartX0 && nowNx < chartX1) {
            const g = cfg.nowW / 2;
            seg(chartX0, nowNx - g);
            seg(nowNx + g, chartX1);
          } else {
            seg(chartX0, chartX1);
          }
        };

        series.forEach(({unit, name}, ci) => {
          const {cy, dMin, dMax} = scales[ci];

          [0, 0.5, 1].forEach(frac => {
            const y = px(cy + chartH * frac);
            if (frac === 0.5) {
              hLine(y, blendLine);
            } else {
              hLine(y, el => el.attr('stroke', 'black').attr('stroke-width', GRID_SW).attr('shape-rendering', 'crispEdges'));
            }
          });

          const lx = chartX0 + chartW + labelGap;
          const capH = labelFs * 0.72;
          [
            {val: dMax, y: cy + capH},
            {val: (dMin + dMax) / 2, y: cy + chartH / 2 + capH / 2},
            {val: dMin, y: cy + chartH},
          ].forEach(({val, y}) => {
            const t = svg.append('text').attr('x', lx).attr('y', y)
              .attr('text-anchor', 'start').attr('dominant-baseline', 'auto')
              .attr('font-family', FONT);
            t.append('tspan').attr('font-size', labelFs).text(Math.round(val));
            t.append('tspan').attr('font-size', unitFs).attr('dx', 2).text(unit);
          });

          svg.append('text')
            .attr('x', chartX0).attr('y', cy - labelFs * 0.4)
            .attr('dominant-baseline', 'auto')
            .attr('font-size', 22).attr('font-family', FONT)
            .attr('fill', 'black')
            .text(name);
        });

        // Pass 4 — current-time line. A solid vertical rule spanning the full stack of
        // charts at the host clock's position on the 7–22h axis (geometry computed in
        // Pass 2). Drawn last (over the h-lines) so it stays continuous across charts and
        // the gaps between them. Blend-difference (white) so it inverts to stay visible
        // over both the black fills and the white background — and the notches it covers
        // were suppressed in Pass 2 so they don't corrupt that inversion. Only drawn when
        // "now" falls inside the charted window.
        if (nowOn) {
          // Reach down to the time label when standing on a labelled hour, replacing the
          // suppressed notch's connector; otherwise stop at the bottom of the last chart.
          const y2 = chartsH + (nowOnMajor ? vExt : 0);
          svg.append('line')
            .attr('x1', nowNx).attr('y1', 0).attr('x2', nowNx).attr('y2', y2)
            .attr('stroke', 'white').attr('stroke-width', cfg.nowW)
            .attr('shape-rendering', 'crispEdges').style('mix-blend-mode', 'difference');
        }
      }

      // ---------------------------------------------------------------------------
      // Week charts — the left column: screen time per day (bars, with the goal as
      // a dotted line), CO₂ and data remaining, over the last N_WEEK local days with
      // today on the right. The same grammar as the weather charts (solid top and
      // bottom rules, blend-mode notches, value+unit labels flush to the column's
      // right edge), but the notches mark midnights and the axis names the days
      // between them. The three charts share the space between the header and the
      // photo.
      // ---------------------------------------------------------------------------
      function renderWeek() {
        const {labelGap, notch, notchSm, notchW, vExt, chartGap, labelFs} = cfg;
        const host = d3.select('.week-charts');
        host.selectAll('*').remove();

        const W = STATS || {};
        const today0 = (() => {const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate());})();
        const day0 = W.windowStart ? new Date(W.windowStart * 1000)
          : new Date(today0.getFullYear(), today0.getMonth(), today0.getDate() - (N_WEEK - 1));
        // Real local midnights, so a DST week still splits on the right hours.
        const mids = d3.range(N_WEEK + 1).map(i =>
          new Date(day0.getFullYear(), day0.getMonth(), day0.getDate() + i) / 1000);

        // Break a curve wherever points are missing, so a gap in the data reads as
        // a gap rather than a straight line bridging it.
        const step = W.step || 1800;
        const withGaps = pts => (pts || []).flatMap((p, i, a) =>
          i && p[0] - a[i - 1][0] > step * 1.5 ? [[a[i - 1][0] + step, null], p] : [p]);

        const screen = d3.range(N_WEEK).map(i => (W.screenHours || [])[i] ?? null);
        const co2 = withGaps(W.co2), dataGB = withGaps(W.dataGB);
        const co2Max = d3.max(co2, p => p[1]) ?? 0;
        const dataMax = d3.max(dataGB, p => p[1]) ?? 0;
        const allowance = W.allowanceGB ?? (Math.ceil(dataMax / 10) * 10 || 50);

        // Even-burn budget for the data allowance: full at the boost's start, empty
        // at its refresh. Staying above it means the allowance lasts.
        let budget = null;
        if (W.allowanceGB && W.boostStart && W.boostEnd > W.boostStart) {
          const at = t => W.allowanceGB * (W.boostEnd - t) / (W.boostEnd - W.boostStart);
          const a = Math.max(mids[0], W.boostStart), b = Math.min(mids[N_WEEK], W.boostEnd);
          if (b > a) budget = [[a, at(a)], [b, at(b)]];
        }

        // Space: from the top of this column down to PHOTO_GAP above the photo,
        // less the day labels under the last chart. Bars take the largest share.
        const avail = document.querySelector('.photo').offsetTop - PHOTO_GAP - host.node().offsetTop;
        const stackH = avail - (vExt + labelFs + 4);
        const barH = Math.round((stackH - 2 * chartGap) * 0.44);
        const lineH = Math.round((stackH - 2 * chartGap - barH) / 2);

        const charts = [
          {
            kind: 'bars', name: 'Screen Time', unit: 'h', h: barH, data: screen,
            dMin: 0, dMax: Math.max(2, Math.ceil(d3.max(screen) ?? 0)), goal: SCREEN_GOAL_H,
          },
          {
            kind: 'area', name: 'CO₂', unit: 'ppm', h: lineH, data: co2, mid: true,
            dMin: 400, dMax: Math.max(1000, Math.ceil(co2Max / 100) * 100),
          },
          {
            kind: 'area', name: 'Data Remaining', unit: 'GB', h: lineH, data: dataGB,
            dMin: 0, dMax: allowance, guide: budget,
          },
        ];
        let y = 0;
        charts.forEach(c => {c.cy = y; y += c.h + chartGap;});
        const chartsH = y - chartGap;

        const svg = host.append('svg')
          .attr('width', COL_W).attr('height', avail)
          .style('display', 'block').style('overflow', 'visible');

        // Value labels per chart: top and bottom, plus the dashed mid-line's value
        // (CO₂) or the goal's (screen time). The bottom label is dropped when the
        // goal sits too close to it to fit both.
        const capH = labelFs * 0.72;
        charts.forEach(c => {
          const yOf = v => c.cy + c.h * (1 - (v - c.dMin) / (c.dMax - c.dMin));
          c.labels = [{val: c.dMax, y: c.cy + capH}];
          if (c.mid) c.labels.push({val: (c.dMin + c.dMax) / 2, y: c.cy + c.h / 2 + capH / 2});
          if (c.goal != null) c.labels.push({val: c.goal, y: yOf(c.goal) + capH / 2});
          const last = c.labels[c.labels.length - 1];
          if (c.cy + c.h - last.y > capH * 1.3) c.labels.push({val: c.dMin, y: c.cy + c.h});
        });

        // Flush layout, as in render(): measure the widest value label so its right
        // edge lands on the column's right edge, and size the plot to fit.
        const unitFs = Math.round(labelFs * 0.85);
        const measure = svg.append('text').attr('font-family', FONT);
        const maxLabelW = Math.max(...charts.flatMap(c => c.labels.map(({val}) => {
          measure.selectAll('*').remove();
          measure.append('tspan').attr('font-size', labelFs).text(Math.round(val));
          measure.append('tspan').attr('font-size', unitFs).attr('dx', 2).text(c.unit);
          const b = measure.node().getBBox();
          return b.x + b.width;
        })));
        measure.remove();

        const chartW = COL_W - labelGap - maxLabelW;
        const x = d3.scaleLinear().domain([mids[0], mids[N_WEEK]]).range([0, chartW]);
        const slotX = i => (x(mids[i]) + x(mids[i + 1])) / 2;   // centre of day i

        // Pass 1 — fills: one bar per day, or the curve filled down to the floor.
        charts.forEach(c => {
          const yScale = d3.scaleLinear().domain([c.dMin, c.dMax]).range([c.cy + c.h, c.cy]).clamp(true);
          c.yScale = yScale;
          if (c.kind === 'bars') {
            const bw = Math.round((x(mids[1]) - x(mids[0])) * 0.62);
            c.data.forEach((v, i) => {
              if (v == null || v <= 0) return;
              const top = Math.round(yScale(v));
              svg.append('rect')
                .attr('x', Math.round(slotX(i) - bw / 2)).attr('y', top)
                .attr('width', bw).attr('height', c.cy + c.h - top)
                .attr('fill', 'black').attr('shape-rendering', 'crispEdges');
              // Hours on the bar: inside its top when there's room, else just above.
              // Blend-difference white, so it reads on either.
              const inside = c.cy + c.h - top > labelFs * 1.5;
              const t = svg.append('text')
                .attr('x', slotX(i)).attr('y', inside ? top + capH + 10 : top - 8)
                .attr('text-anchor', 'middle').attr('font-family', FONT).attr('font-weight', 500)
                .attr('fill', 'white').style('mix-blend-mode', 'difference');
              t.append('tspan').attr('font-size', Math.round(labelFs * 0.85)).text(v.toFixed(1));
              t.append('tspan').attr('font-size', Math.round(unitFs * 0.85)).attr('dx', 1).text('h');
            });
          } else {
            svg.append('path').datum(c.data)
              .attr('fill', 'black').attr('stroke', 'none').attr('shape-rendering', 'crispEdges')
              .attr('d', d3.area().defined(p => p[1] != null)
                .x(p => x(p[0])).y0(c.cy + c.h).y1(p => yScale(p[1])).curve(d3.curveMonotoneX));
          }
        });

        // Pass 2 — notches. Midnights get the major notch (solid at the outer edges,
        // inset so they don't poke out; blend-mode inside), extending down toward the
        // day labels under the last chart. Midday gets a minor notch on the curves;
        // on the bars it would land in each bar's middle.
        mids.forEach((t, i) => {
          const isOuter = i === 0 || i === N_WEEK;
          const vx = isOuter ? (i === 0 ? notchW / 2 : Math.round(chartW) - notchW / 2) : crispX(x(t), notchW);
          const tick = el => isOuter
            ? el.attr('stroke', 'black').attr('stroke-width', notchW).attr('shape-rendering', 'crispEdges')
            : blendTick(el);
          charts.forEach((c, ci) => {
            const bot = c.cy + c.h;
            const topExt = isOuter ? 0 : notch;
            const botExt = ci === charts.length - 1 ? vExt : (isOuter ? 0 : notch);
            tick(svg.append('line').attr('x1', vx).attr('y1', c.cy - topExt + 1).attr('x2', vx).attr('y2', c.cy + notch + 1));
            tick(svg.append('line').attr('x1', vx).attr('y1', bot - notch).attr('x2', vx).attr('y2', bot + botExt));
          });
        });
        d3.range(N_WEEK).forEach(i => {
          const vx = crispX(slotX(i), notchW);
          charts.filter(c => c.kind === 'area').forEach(c => {
            const bot = c.cy + c.h;
            blendTick(svg.append('line').attr('x1', vx).attr('y1', c.cy + 1).attr('x2', vx).attr('y2', c.cy + notchSm + 1));
            blendTick(svg.append('line').attr('x1', vx).attr('y1', bot - notchSm).attr('x2', vx).attr('y2', bot));
          });
        });

        // Pass 3 — rules, guides, labels and names, over the notches.
        const solid = el => el.attr('stroke', 'black').attr('stroke-width', GRID_SW).attr('shape-rendering', 'crispEdges');
        // Goals and budgets are dotted, heavier than the dashed mid-line so the two
        // never read as the same thing; blend-difference to show across the fills.
        const dotted = el => el.attr('stroke', 'white').attr('stroke-width', 2).attr('stroke-dasharray', '2,6')
          .attr('stroke-linecap', 'butt').style('mix-blend-mode', 'difference');
        charts.forEach(c => {
          const line = (x1, y1, x2, y2) => svg.append('line').attr('x1', x1).attr('y1', y1).attr('x2', x2).attr('y2', y2);
          solid(line(0, px(c.cy), chartW, px(c.cy)));
          solid(line(0, px(c.cy + c.h), chartW, px(c.cy + c.h)));
          if (c.mid) blendLine(line(0, px(c.cy + c.h / 2), chartW, px(c.cy + c.h / 2)));
          if (c.goal != null) {
            const gy = Math.round(c.yScale(c.goal));
            dotted(line(0, gy, chartW, gy));
          }
          if (c.guide) {
            const [[t1, v1], [t2, v2]] = c.guide;
            dotted(line(x(t1), c.yScale(v1), x(t2), c.yScale(v2)));
          }

          const lx = chartW + labelGap;
          c.labels.forEach(({val, y}) => {
            const t = svg.append('text').attr('x', lx).attr('y', y).attr('font-family', FONT);
            t.append('tspan').attr('font-size', labelFs).text(Math.round(val));
            t.append('tspan').attr('font-size', unitFs).attr('dx', 2).text(c.unit);
          });

          svg.append('text')
            .attr('x', 0).attr('y', c.cy - labelFs * 0.4)
            .attr('font-size', 22).attr('font-family', FONT).attr('fill', 'black')
            .text(c.name);
        });

        // Day labels, centred in each slot under the last chart. Today's is set
        // white on a black pill, as the calendar used to mark it.
        const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const labelY = chartsH + vExt + 4;
        d3.range(N_WEEK).forEach(i => {
          const d = new Date(mids[i] * 1000);
          const isToday = +d === +today0;
          if (isToday) {
            const pw = Math.round((x(mids[1]) - x(mids[0])) * 0.8), ph = Math.round(labelFs * 1.4);
            svg.append('rect')
              .attr('x', Math.round(slotX(i) - pw / 2)).attr('y', Math.round(labelY + capH / 2 - ph / 2))
              .attr('width', pw).attr('height', ph).attr('rx', 10).attr('fill', 'black');
          }
          svg.append('text')
            .attr('x', slotX(i)).attr('y', labelY + capH)
            .attr('text-anchor', 'middle').attr('font-family', FONT).attr('font-size', labelFs)
            .attr('font-weight', isToday ? 700 : 400).attr('fill', isToday ? 'white' : 'black')
            .text(WD[d.getDay()]);
        });
      }

      // Re-render both columns (on any cfg change).
      function renderAll() {
        render();
        renderWeek();
      }

      // ---------------------------------------------------------------------------
      // Conditions — a compact KPI header: a hero current-temp + condition line,
      // then a strip of metric cells (feels-like, high, low, wind). Purely
      // data-driven to match the charts below; no prose.
      // ---------------------------------------------------------------------------
      (function buildConditions() {
        const round = v => (v != null ? Math.round(v) : null);
        // value + unit markup: the 'C' rides close to the number (matching the
        // chart axes, e.g. "15C" — a shrunk ° symbol reads as a stray dot); word
        // units like mph get a wider gap. Em-relative size, so it scales with the
        // font it's set in.
        const vu = (v, unit) => {
          if (v == null) return '—';
          if (unit === 'C') return `${v}<span class="unit">C</span>`;
          return `${v}<span class="unit txt">${unit}</span>`;
        };

        document.getElementById('w-temp').innerHTML = vu(round(DATA.temp), 'C');
        document.getElementById('w-condition').textContent = DATA.condition || '';

        const metrics = [
          {label: 'Feels like', v: round(DATA.feelsLike), unit: 'C'},
          {label: 'High', v: round(DATA.tempMax), unit: 'C'},
          {label: 'Low', v: round(DATA.tempMin), unit: 'C'},
          {label: 'Wind', v: round(DATA.windMPH), unit: 'mph'},
        ];
        const wrap = document.getElementById('w-metrics');
        metrics.forEach(m => {
          const cell = document.createElement('div');
          cell.className = 'metric';
          cell.innerHTML =
            `<div class="metric-label">${m.label}</div>` +
            `<div class="metric-value">${vu(m.v, m.unit)}</div>`;
          wrap.appendChild(cell);
        });
      })();

      // ---------------------------------------------------------------------------
      // Left header — today's date over a strip of the latest personal stats.
      // ---------------------------------------------------------------------------
      (function buildStatsHeader() {
        const now = new Date();
        const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const MO = ['January', 'February', 'March', 'April', 'May', 'June',
          'July', 'August', 'September', 'October', 'November', 'December'];
        const ordinal = n => {const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]);};
        document.getElementById('date-title').textContent =
          `${WD[now.getDay()]} ${ordinal(now.getDate())} ${MO[now.getMonth()]}`;

        const W = STATS || {};
        const u = unit => `<span class="unit txt">${unit}</span>`;
        const screenToday = (W.screenHours || [])[N_WEEK - 1];
        const hm = h => {
          const m = Math.round(h * 60);
          return m >= 60 ? `${Math.floor(m / 60)}${u('h')} ${m % 60}${u('m')}` : `${m}${u('m')}`;
        };
        const renews = (() => {
          if (!W.boostEnd) return '—';
          const end = new Date(W.boostEnd * 1000);
          const days = Math.round((new Date(end.getFullYear(), end.getMonth(), end.getDate()) -
            new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
          return days <= 0 ? 'Today' : `${days}${u(days === 1 ? 'day' : 'days')}`;
        })();

        const metrics = [
          {label: 'Screen', html: screenToday != null ? hm(screenToday) : '—'},
          {label: 'CO₂', html: W.co2Now != null ? `${Math.round(W.co2Now)}${u('ppm')}` : '—'},
          {label: 'Data left', html: W.dataNowGB != null ? `${W.dataNowGB.toFixed(1)}${u('GB')}` : '—'},
          {label: 'Renews in', html: renews},
        ];
        const wrap = document.getElementById('s-metrics');
        metrics.forEach(m => {
          const cell = document.createElement('div');
          cell.className = 'metric';
          cell.innerHTML = `<div class="metric-label">${m.label}</div><div class="metric-value">${m.html}</div>`;
          wrap.appendChild(cell);
        });
      })();

      if (DATA.debug) document.body.classList.add('debug');

      renderAll();
      // Layout and label widths depend on Inter's metrics; draw again once it has
      // loaded, so a late web font can't leave the charts sized for the fallback.
      document.fonts.ready.then(renderAll);

      // ---------------------------------------------------------------------------
      // Photo — pick one of the server's images at random and dither it (1-bit
      // Atkinson) on a <canvas> at the device's pixel resolution into the bottom-
      // right slot. The headless renderer waits on window.__renderDone before capture.
      // ---------------------------------------------------------------------------
      window.__renderDone = false;
      const renderDone = () => document.fonts.ready.then(() => {window.__renderDone = true;});
      setTimeout(() => {window.__renderDone = true;}, 4000);   // backstop: never block the screenshot forever

      // Dither knobs — edits hot-reload on the next render.
      const DITHER = {
        levels: 2,      // output grays for the keeper: 2 = pure B/W … 16 = panel max (4-bit)
        gamut: false,   // remap output into the panel's sRGB range [40, 215]
      };

      const PHOTOS = (() => {
        try {return JSON.parse(document.getElementById('photos-data').textContent) || [];}
        catch (e) {return [];}
      })();

      // Quantise a value to the nearest of `levels` evenly-spaced grays.
      const snap = (v, step) => Math.max(0, Math.min(255, Math.round(v / step) * step));

      // Atkinson error diffusion: spread 1/8 of the error to each of 6 neighbours
      // (only 6/8 propagates → crisp, high-contrast 1-bit; deliberately B/W since
      // the panel's pure black/white are its most reliable, highest-contrast states).
      function ditherAtkinson(g, w, h, step) {
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
          const i = y * w + x, e = (g[i] - (g[i] = snap(g[i], step))) / 8;
          if (x + 1 < w) g[i + 1] += e;
          if (x + 2 < w) g[i + 2] += e;
          if (y + 1 < h) {
            if (x > 0) g[i + w - 1] += e;
            g[i + w] += e;
            if (x + 1 < w) g[i + w + 1] += e;
          }
          if (y + 2 < h) g[i + 2 * w] += e;
        }
      }

      // Cover-crop `img` into `canvas`, Atkinson-dither it, and paint it back.
      // Canvas pixel size is read from its CSS box, so dithering is 1:1 with output.
      function paintDither(canvas, img) {
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (!w || !h) return;
        canvas.width = w; canvas.height = h;
        const cover = Math.max(w / img.naturalWidth, h / img.naturalHeight);
        const dw = img.naturalWidth * cover, dh = img.naturalHeight * cover;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);   // cover-crop, centred

        const imgData = ctx.getImageData(0, 0, w, h), d = imgData.data;
        const g = new Float32Array(w * h);   // luminance; float so error can over/underflow
        for (let i = 0; i < w * h; i++) {
          g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
        }

        ditherAtkinson(g, w, h, 255 / (DITHER.levels - 1));

        const lo = 40, hi = 215;
        for (let i = 0; i < w * h; i++) {
          const v = Math.round(DITHER.gamut ? lo + (g[i] / 255) * (hi - lo) : g[i]);
          d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v;
          d[i * 4 + 3] = 255;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      // Generative fallback art — when the server has no photo (debug mode, or
      // opening dashboard.html straight from disk) the slot would sit empty, so
      // fill it with a 1-bit Truchet pattern instead. Each tile draws one of two
      // pairs of quarter-circle arcs; every arc end lands on an edge midpoint, so
      // strokes always join across tiles into one continuous flowing maze. Grid
      // density, stroke weight and per-tile orientation are randomised, so it's a
      // different pattern on every render. Black on white to stay light under the
      // airy calendar above it; thresholded at the end to keep it truly 1-bit.
      function paintTruchet(canvas) {
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (!w || !h) return;
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);

        // Square-ish tiles sized off the short edge, so the slot's aspect doesn't
        // skew them. 6–9 rows → a comfortably legible density on the panel.
        const rows = 6 + Math.floor(Math.random() * 4);
        const s = h / rows;
        const cols = Math.ceil(w / s);
        const m = s / 2;                          // edge-midpoint offset / arc radius
        const HALF = Math.PI / 2;

        ctx.strokeStyle = '#000';
        ctx.lineCap = 'round';
        ctx.lineWidth = Math.max(2, s * (0.10 + Math.random() * 0.06));

        const arc = (cx, cy, a0) => {ctx.beginPath(); ctx.arc(cx, cy, m, a0, a0 + HALF); ctx.stroke();};
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          const x = c * s, y = r * s;
          if (Math.random() < 0.5) {             // arcs in the TL + BR corners
            arc(x, y, 0);
            arc(x + s, y + s, Math.PI);
          } else {                               // arcs in the TR + BL corners
            arc(x + s, y, HALF);
            arc(x, y + s, 3 * HALF);
          }
        }

        // Frame the panel (rounded to match the calendar grid / photo slot; the
        // canvas's CSS border-radius clips the corners to suit).
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(1, 1, w - 2, h - 2, 30);
        ctx.stroke();

        // Hard threshold → pure black/white, dropping the arcs' anti-aliased grays.
        const im = ctx.getImageData(0, 0, w, h), d = im.data;
        for (let i = 0; i < d.length; i += 4) {
          const v = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) < 128 ? 0 : 255;
          d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
        }
        ctx.putImageData(im, 0, 0);
      }

      const paintFallback = () => {
        try {paintTruchet(document.getElementById('photo-canvas'));}
        catch (e) {console.error('fallback art failed', e);}
        requestAnimationFrame(renderDone);
      };

      if (PHOTOS.length) {
        const img = new Image();
        img.crossOrigin = 'anonymous';     // CORS-clean so getImageData isn't tainted
        img.onload = () => {
          try {paintDither(document.getElementById('photo-canvas'), img);}
          catch (e) {console.error('dither failed', e);}
          requestAnimationFrame(renderDone);   // ensure the canvas paints before capture
        };
        img.onerror = () => {console.error('photo load failed', img.src); paintFallback();};
        img.src = PHOTOS[0];   // the server chooses which photo (per --photo-strategy)
      } else {
        paintFallback();
      }

      // ---------------------------------------------------------------------------
      // Controls panel — browser preview only (hidden in headless Chrome render)
      // ---------------------------------------------------------------------------
      if (!DATA.headless) {
        // Scale page to fit viewport so it looks approximately the right physical size
        document.body.style.zoom = Math.min(window.innerWidth / 1872, window.innerHeight / 1404).toFixed(3);

        // Show device bounds: gray backdrop + shadow on the page element
        document.documentElement.style.background = '#b0b0b0';
        document.querySelector('.page').style.boxShadow = '0 4px 24px rgba(0,0,0,0.35)';

        const SLIDERS = [
          {key: 'chartH', label: 'Chart height', min: 30, max: 200, step: 2},
          {key: 'chartGap', label: 'Gap between charts', min: 0, max: 150, step: 2},
          {key: 'labelGap', label: 'Label ↔ h-line gap', min: 0, max: 30, step: 1},
          {key: 'notch', label: 'Notch depth', min: 0, max: 80, step: 1},
          {key: 'notchSm', label: 'Minor notch depth', min: 0, max: 40, step: 1},
          {key: 'notchW', label: 'Notch width', min: 1, max: 8, step: 1},
          {key: 'nowW', label: 'Now-line width', min: 1, max: 8, step: 1},
          {key: 'vExt', label: 'V-line overhang', min: 0, max: 100, step: 1},
          {key: 'labelFs', label: 'Font size', min: 8, max: 60, step: 1},
        ];

        const panel = Object.assign(document.createElement('div'), {id: 'cfg-panel'});
        Object.assign(panel.style, {
          position: 'fixed', top: '12px', right: '12px', zIndex: '9999',
          background: 'rgba(255,255,255,0.92)', border: '1px solid #ccc',
          borderRadius: '8px', padding: '12px 16px', fontFamily: 'monospace',
          fontSize: '11px', lineHeight: '1.6', minWidth: '220px',
          boxShadow: '0 2px 12px rgba(0,0,0,0.15)', backdropFilter: 'blur(4px)',
        });

        const controls = {};  // key -> {input, val}, so Import can sync the sliders
        SLIDERS.forEach(({key, label, min, max, step}) => {
          const row = document.createElement('div');
          const lbl = Object.assign(document.createElement('label'), {textContent: label});
          const val = Object.assign(document.createElement('span'), {textContent: cfg[key]});
          Object.assign(val.style, {float: 'right', color: '#555', minWidth: '32px', textAlign: 'right'});
          const input = Object.assign(document.createElement('input'), {
            type: 'range', min, max, step, value: cfg[key],
          });
          Object.assign(input.style, {width: '100%', margin: '2px 0 6px', display: 'block'});
          input.addEventListener('input', () => {
            cfg[key] = Number(input.value);
            val.textContent = cfg[key];
            renderAll();
          });
          lbl.appendChild(val);
          row.appendChild(lbl);
          row.appendChild(input);
          panel.appendChild(row);
          controls[key] = {input, val};
        });

        // Preview-only "now" scrubber — moves the current-time line so you can see
        // where it lands (e.g. exactly on an hour, overlapping a notch). Deliberately
        // separate from the cfg sliders above so it's never exported to config.json.
        {
          const fmtTime = h => {
            const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
            return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
          };
          const lastHour = START_HOUR + N_DAY - 1;
          const realNow = new Date();
          const init = Math.min(lastHour, Math.max(START_HOUR, realNow.getHours() + realNow.getMinutes() / 60));
          nowHour = init;   // preview drives "now" from here on; headless render is unaffected

          const row = document.createElement('div');
          Object.assign(row.style, {marginTop: '10px', paddingTop: '10px', borderTop: '1px dashed #bbb'});
          const lbl = Object.assign(document.createElement('label'), {textContent: 'Now (preview only)'});
          const val = Object.assign(document.createElement('span'), {textContent: fmtTime(init)});
          Object.assign(val.style, {float: 'right', color: '#555', minWidth: '44px', textAlign: 'right'});
          const input = Object.assign(document.createElement('input'), {
            type: 'range', min: START_HOUR, max: lastHour, step: 0.25, value: init,
          });
          Object.assign(input.style, {width: '100%', margin: '2px 0 6px', display: 'block'});
          input.addEventListener('input', () => {
            nowHour = Number(input.value);
            val.textContent = fmtTime(nowHour);
            render();
          });
          lbl.appendChild(val);
          row.appendChild(lbl);
          row.appendChild(input);
          panel.appendChild(row);
          render();   // reflect the initial preview time immediately
        }

        // Reflect the current cfg back onto every slider + readout, then re-render.
        // Used after an import so the panel matches the loaded values.
        const syncControls = () => {
          for (const key in controls) {
            controls[key].input.value = cfg[key];
            controls[key].val.textContent = cfg[key];
          }
          renderAll();
        };

        // Apply — download the current cfg as config.json. Drop it next to the
        // server (or commit it) and the next render picks up these values.
        const apply = Object.assign(document.createElement('button'), {textContent: 'Apply → config.json'});
        Object.assign(apply.style, {
          width: '100%', marginTop: '10px', padding: '7px', cursor: 'pointer',
          font: 'inherit', borderRadius: '6px', border: '1px solid #999',
          background: '#f3f3f3',
        });
        const hint = Object.assign(document.createElement('div'), {
          textContent: 'Save next to the server (or commit it), then re-render.',
        });
        Object.assign(hint.style, {color: '#777', fontSize: '10px', marginTop: '5px', lineHeight: '1.4'});
        apply.addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(cfg, null, 2) + '\n'], {type: 'application/json'});
          const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(blob), download: 'config.json'});
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(a.href);
          apply.textContent = 'Downloaded ✓';
          setTimeout(() => {apply.textContent = 'Apply → config.json';}, 1500);
        });
        panel.appendChild(apply);

        // Import — load a config.json back into the panel. Only known keys are
        // applied, so a stale file with extra/missing keys still works.
        const importBtn = Object.assign(document.createElement('button'), {textContent: 'Import config.json'});
        Object.assign(importBtn.style, {
          width: '100%', marginTop: '6px', padding: '7px', cursor: 'pointer',
          font: 'inherit', borderRadius: '6px', border: '1px solid #999',
          background: '#f3f3f3',
        });
        const fileInput = Object.assign(document.createElement('input'), {type: 'file', accept: 'application/json,.json'});
        fileInput.style.display = 'none';
        importBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
          const file = fileInput.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const loaded = JSON.parse(reader.result);
              if (!loaded || typeof loaded !== 'object') throw new Error('not an object');
              for (const key in loaded) {
                if (key in cfg && typeof loaded[key] === 'number') cfg[key] = loaded[key];
              }
              syncControls();
              importBtn.textContent = 'Imported ✓';
            } catch (e) {
              importBtn.textContent = 'Invalid JSON ✗';
            }
            setTimeout(() => {importBtn.textContent = 'Import config.json';}, 1500);
            fileInput.value = '';  // allow re-importing the same file
          };
          reader.readAsText(file);
        });
        panel.appendChild(importBtn);
        panel.appendChild(fileInput);
        panel.appendChild(hint);

        document.body.appendChild(panel);
      }

    })();
  </script>

</body>

</html>
